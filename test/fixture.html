<!doctype html><meta charset=utf-8><title>Mist Overhaul — проверка юзерскрипта</title>
<!-- Отдать по http (на file:// не поедет <script src>) и открыть с новым
     query-параметром, иначе браузер подсунет закешированный скрипт.
     Ждать пять PASS; первый прогон качает ~54 МБ, дальше берёт из хранилища. -->
<script src="../mist-overhaul.user.js"></script>

<div id="host"></div>
<pre id="out">…</pre>

<script>
const host = document.getElementById('host');
const out = document.getElementById('out');
const put = npc => host.innerHTML =
  `<div class="userpic" style="background: url(//i.mist-game.ru/npc/${npc}.jpg); border: 1px solid #f1e8c9;"></div>`;

const log = [];
const check = (label, ok) => {
  log.push((ok ? 'PASS ' : 'FAIL ') + label);
  out.textContent = log.join('\n');
};
const el = () => host.firstElementChild;
const css = p => getComputedStyle(el())[p];
const sleep = ms => new Promise(r => setTimeout(r, ms));

(async () => {
  put('bride_amalia_milton_8thmarch');     // анимированный: <video> поверх
  await sleep(400);
  check('анимация подменена', el().dataset.mistOverhaul === 'bride_amalia_milton_8thmarch'
        && !!el().querySelector('video.mist-overhaul'));
  check('оригинал остался запасным слоем',
        /i\.mist-game\.ru\/npc\/bride_amalia_milton_8thmarch\.jpg/.test(css('backgroundImage')));
  // слоёв два, поэтому computed-значение повторяется под каждый
  check('масштаб под картинку 2x', /^(100% 100%)(, \1)*$/.test(css('backgroundSize')));

  put('caravaneer');                  // статичный, и без перезагрузки страницы
  await sleep(400);
  check('смена персонажа подхвачена', el().dataset.mistOverhaul === 'caravaneer'
        && !el().querySelector('video.mist-overhaul')
        && /caravaneer\.[0-9a-f]+\.webp/.test(css('backgroundImage')));

  // портреты должны лечь в хранилище сами, без встречи с персонажем
  let n = 0;
  for (let i = 0; i < 90 && n < 22; i++) {
    await sleep(2000);
    n = (await (await caches.open('mist-overhaul')).keys()).length;
    out.textContent = log.join('\n') + `\n… в хранилище ${n} из 22`;
  }
  check(`предзагрузка всех портретов (в хранилище ${n})`, n >= 22);
})();
</script>
