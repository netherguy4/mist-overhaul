<!doctype html><meta charset=utf-8><meta name="viewport" content="width=device-width, initial-scale=1"><style>pre { white-space: pre-wrap; }</style><title>Mist Overhaul — проверка юзерскрипта</title>
<!-- Отдать по http (на file:// не поедет <script src>) и открыть с новым
     query-параметром, иначе браузер подсунет закешированный скрипт.
     Ждать все PASS; первый прогон качает ~54 МБ, дальше берёт из хранилища. -->
<script src="../mist-overhaul.user.js"></script>

<div id="host"></div>
<pre id="out">…</pre>

<script>
const host = document.getElementById('host');
const out = document.getElementById('out');
const put = npc => host.innerHTML =
  `<div class="userpic" style="width:181px;height:267px;background:url(//i.mist-game.ru/npc/${npc}.jpg);border:1px solid #f1e8c9;"></div>`;

const log = [];
const check = (label, ok) => {
  log.push((ok ? 'PASS ' : 'FAIL ') + label);
  out.textContent = log.join('\n');
};
const el = () => host.firstElementChild;
const css = p => getComputedStyle(el())[p];
const sleep = ms => new Promise(r => setTimeout(r, ms));
// подмена асинхронная и ждёт хранилище, а его в это же время набивает
// предзагрузка — на холодном прогоне это дольше секунды, поэтому не пауза
const until = async cond => {
  for (let i = 0; i < 100 && !cond(); i++) await sleep(100);
  return cond();
};

(async () => {
  put('bride_amalia_milton_8thmarch');     // анимированный: <video> поверх
  check('анимация подменена', await until(() =>
        el().dataset.mistOverhaul === 'bride_amalia_milton_8thmarch'
        && !!el().querySelector('video.mist-overhaul')));
  check('оригинал остался запасным слоем',
        /i\.mist-game\.ru\/npc\/bride_amalia_milton_8thmarch\.jpg/.test(css('backgroundImage')));
  // слоёв два, поэтому computed-значение повторяется под каждый
  check('масштаб под картинку 2x', /^(100% 100%)(, \1)*$/.test(css('backgroundSize')));

  const video = el().querySelector('video.mist-overhaul');
  el().remove();
  await sleep(200);                   // браузер успевает остановить отсоединённое видео
  put('bride_amalia_milton_8thmarch');
  const resumed = await until(() => el().querySelector('video.mist-overhaul') === video
                                      && !video.paused);
  const resumedAt = video.currentTime;
  await sleep(300);
  check('анимация продолжается после возврата во вкладку',
        resumed && video.currentTime !== resumedAt);

  put('corvin');                      // другой персонаж, и без перезагрузки страницы
  check('смена персонажа подхвачена', await until(() =>
        el().dataset.mistOverhaul === 'corvin'
        && el().querySelector('video.mist-overhaul') !== video
        // адрес бывает и blob: из хранилища, и прямой с зеркала — важны два слоя
        && css('backgroundImage').split(/,(?=\s*url)/).length === 2));

  put('gorkonia');                    // новый персонаж и его анимация
  check('анимация Горконии подменена', await until(() =>
        el().dataset.mistOverhaul === 'gorkonia'
        && el().querySelector('video.mist-overhaul')?.dataset.npc === 'gorkonia'
        && css('backgroundImage').split(/,(?=\s*url)/).length === 2));

  const field = document.createElement('div');
  field.className = 'userpic';
  field.style.cssText = 'position:relative;width:181px;height:267px;background:url(https://i.mist-game.ru//units/m/298.jpg?v=39)';
  host.replaceChildren(field);
  check('боевой портрет Симона заменён видео', await until(() =>
    field.querySelector('video')?.dataset.npc === 'ghost_simon_kornish'));
  field.style.backgroundImage = 'url(https://i.mist-game.ru//units/m/999999.jpg?v=39)';
  check('при смене на неизвестного противника старое видео удаляется', await until(() =>
    !field.querySelector('video') && !field.dataset.mistOverhaul));
  field.style.backgroundImage = 'url(https://i.mist-game.ru//units/m/298.jpg?v=40)';
  check('возврат к Симону запускает видео', await until(() =>
    field.querySelector('video')?.dataset.npc === 'ghost_simon_kornish'));
  field.style.backgroundImage = 'url(https://i.mist-game.ru//units/m/298.jpg?v=41)';
  check('перезапись фона того же противника сохраняет один видеослой', await until(() =>
    field.querySelectorAll('video').length === 1 && field.style.backgroundImage.includes('blob:')));
  field.style.backgroundImage = 'url(https://i.mist-game.ru/npc/corvin.jpg)';
  await Promise.resolve();
  field.style.backgroundImage = 'url(https://i.mist-game.ru//units/m/999999.jpg)';
  await sleep(100);
  check('запоздалый ответ не перекрывает нового противника',
    !field.querySelector('video') && !field.dataset.mistOverhaul);
  field.style.backgroundImage = 'url(https://i.mist-game.ru//units/m/298.jpg?v=39)';

  for (const [id, name] of [
    [215, 'gorkonia'], [216, 'demandred'], [293, 'bride_amalia_milton'],
    [294, 'indiana_lester'],
    [295, 'rogue_brun'], [296, 'prisoner_toivo_beilish'],
    [297, 'rogue_girl_deina'], [298, 'ghost_simon_kornish'],
  ]) {
    field.style.backgroundImage = `url(https://i.mist-game.ru//units/m/${id}.jpg?v=39)`;
    check(`боевой ID ${id} → ${name}`, await until(() =>
      field.querySelector('video')?.dataset.npc === name));
  }

  for (const [id, name] of [
    [219, 'demandred'], [220, 'gorkonia'], [304, 'caravaneer'], [422, 'white_mage'],
  ]) {
    field.style.backgroundImage = `url(https://i.mist-game.ru//m/m/${id}.jpg?v=39)`;
    check(`портрет монстра ${id} → ${name}`, await until(() =>
      field.querySelector('video')?.dataset.npc === name));
  }

  // портреты должны лечь в хранилище сами, без встречи с персонажем
  let n = 0;
  for (let i = 0; i < 90 && n < 46; i++) {
    await sleep(2000);
    n = (await (await caches.open('mist-overhaul')).keys()).length;
    out.textContent = log.join('\n') + `\n… в хранилище ${n} из 46`;
  }
  check(`предзагрузка всех файлов портретов (в хранилище ${n})`, n >= 46);
})();
</script>
